# Nur die Datenbank für die lokale Entwicklung. Die App läuft mit "pnpm dev".
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: certifybird
      POSTGRES_PASSWORD: certifybird
      POSTGRES_DB: certifybird
    ports:
      - "5432:5432"
    volumes:
      - db-dev:/var/lib/postgresql/data

volumes:
  db-dev:
